<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Portal</title>
<style>
body { margin:0; font-family: Arial; background:#111; color:white; }
.header { padding:20px; text-align:center; font-size:28px; background:#222; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:10px; }
.card { background:#1e1e1e; padding:20px; text-align:center; border-radius:10px; }
.card:hover { background:#333; }
a { color:white; text-decoration:none; display:block; }
</style>
</head>
<body>
<div class="header">My TV Portal</div>
<div class="grid">
<a class="card" href="https://www.youtube.com" target="_blank">YouTube</a>
<a class="card" href="https://www.netflix.com" target="_blank">Netflix</a>
<a class="card" href="https://www.youtube.com/feed/trending" target="_blank">Trending</a>
<a class="card" href="https://www.youtube.com/live" target="_blank">Live TV</a>
<a class="card" href="https://www.google.com" target="_blank">Google</a>
<a class="card" href="https://tools4cydia.github.io/Tv/" target="_blank">Original Repo</a>
</div>
</body>
</html>
